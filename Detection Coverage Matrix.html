<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Detection Coverage Matrix</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: sticky header + filter bar, scrolling card list */
:root {
  --bg:         #f0f4f8;
  --surface:    #ffffff;
  --surface2:   #eaeff5;
  --border:     #d0d8e4;
  --border2:    #e8eef4;
  --fg:         #1a2233;
  --fg-muted:   #4e5d72;
  --fg-subtle:  #8695a8;

  --cs:         #e05a1e;
  --cs-bg:      #fff1eb;
  --cs-border:  #f7c8af;

  --spl:        #007aab;
  --spl-bg:     #e8f5ff;
  --spl-border: #b0d9f2;

  --both:       #6b3fa0;
  --both-bg:    #f3edfc;
  --both-border:#d1b8f5;

  --green:      #1a7f37;
  --green-bg:   #dcfce7;
  --green-dk:   #166534;

  --amber:      #925f0f;
  --amber-bg:   #fef9c3;

  --shadow-sm:  0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow:     0 2px 6px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);

  --font-ui:    'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:  'IBM Plex Mono', 'Fira Mono', monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0d1117;
    --surface:    #161b22;
    --surface2:   #1f2633;
    --border:     #2d3748;
    --border2:    #1f2633;
    --fg:         #e2e8f0;
    --fg-muted:   #94a3b8;
    --fg-subtle:  #5a6a80;

    --cs:         #f0883e;
    --cs-bg:      #2a1400;
    --cs-border:  #5a2c00;

    --spl:        #56b3e6;
    --spl-bg:     #001d2e;
    --spl-border: #003d5c;

    --both:       #a78bfa;
    --both-bg:    #1a1030;
    --both-border:#40206a;

    --green:      #4ade80;
    --green-bg:   #052e16;
    --green-dk:   #4ade80;

    --amber:      #fbbf24;
    --amber-bg:   #1c1500;

    --shadow-sm:  0 1px 3px rgba(0,0,0,.4);
    --shadow:     0 2px 8px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --surface2: #1f2633;
  --border: #2d3748; --border2: #1f2633; --fg: #e2e8f0;
  --fg-muted: #94a3b8; --fg-subtle: #5a6a80;
  --cs: #f0883e; --cs-bg: #2a1400; --cs-border: #5a2c00;
  --spl: #56b3e6; --spl-bg: #001d2e; --spl-border: #003d5c;
  --both: #a78bfa; --both-bg: #1a1030; --both-border: #40206a;
  --green: #4ade80; --green-bg: #052e16; --green-dk: #4ade80;
  --amber: #fbbf24; --amber-bg: #1c1500;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4); --shadow: 0 2px 8px rgba(0,0,0,.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--fg);
  margin: 0;
  padding-inline: 24px;
  padding-block: 0;
  font-size: 14px;
  line-height: 1.5;
}

/* ── HEADER ─────────────────────────────────── */
.page-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-inline: -24px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.page-header h1 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -.01em;
}

.eng-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  color: var(--fg-muted);
  letter-spacing: .04em;
}

.header-gap { flex: 1; }

.updated-label {
  font-size: 11px;
  color: var(--fg-subtle);
  font-family: var(--font-mono);
}

/* ── SUMMARY TILES ──────────────────────────── */
.summary-row {
  display: flex;
  gap: 10px;
  padding: 18px 0 14px;
  flex-wrap: wrap;
}

.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 16px;
  min-width: 85px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.tile-num {
  font-size: 24px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.tile-lbl {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--fg-muted);
  margin-top: 3px;
}
.tile-total .tile-num { color: var(--fg); }
.tile-cs    .tile-num { color: var(--cs); }
.tile-spl   .tile-num { color: var(--spl); }
.tile-both  .tile-num { color: var(--both); }
.tile-active .tile-num { color: var(--green); }

/* ── FILTER BAR ─────────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 0 14px;
  flex-wrap: wrap;
}
.filter-lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg-subtle);
  margin-right: 2px;
}
.fbtn {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-muted);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  line-height: 1;
}
.fbtn:hover { background: var(--surface2); color: var(--fg); }
.fbtn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fbtn[data-filter="cs"].active    { background: var(--cs); border-color: var(--cs); color: #fff; }
.fbtn[data-filter="splunk"].active { background: var(--spl); border-color: var(--spl); color: #fff; }
.fbtn[data-filter="both"].active  { background: var(--both); border-color: var(--both); color: #fff; }

/* ── CARD LIST ──────────────────────────────── */
.cards { display: flex; flex-direction: column; gap: 10px; padding-bottom: 48px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s, border-color .15s;
}
.card:hover { box-shadow: var(--shadow); }
.card[data-type="cs"]     { border-left-color: var(--cs); }
.card[data-type="splunk"] { border-left-color: var(--spl); }
.card[data-type="both"]   { border-left-color: var(--both); }
.card.hidden              { display: none; }

/* card top row */
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 16px 10px;
  flex-wrap: wrap;
}
.card-name {
  font-size: 14px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
  line-height: 1.3;
}
.badges { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; align-items: center; }

.badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  white-space: nowrap;
  line-height: 1.5;
}
.badge-cs     { background: var(--cs-bg); color: var(--cs); border-color: var(--cs-border); }
.badge-spl    { background: var(--spl-bg); color: var(--spl); border-color: var(--spl-border); }
.badge-both   { background: var(--both-bg); color: var(--both); border-color: var(--both-border); }
.badge-active { background: var(--green-bg); color: var(--green-dk); }
.badge-test   { background: var(--amber-bg); color: var(--amber); }

/* card description */
.card-desc {
  padding: 0 16px 10px;
  color: var(--fg-muted);
  font-size: 13px;
  line-height: 1.6;
}

/* splunk-only caution note */
.caution-note {
  margin: 0 16px 10px;
  padding: 7px 10px 7px 12px;
  background: var(--amber-bg);
  border-radius: 6px;
  border-left: 3px solid var(--amber);
  font-size: 12px;
  color: var(--amber);
  font-weight: 500;
}

/* response actions */
.actions-row {
  padding: 0 16px 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.actions-lbl {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg-subtle);
  margin-right: 2px;
  white-space: nowrap;
}
.atag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--fg-muted);
  white-space: nowrap;
}
.atag-auto   { background: var(--green-bg); color: var(--green-dk); border-color: transparent; }
.atag-notify { background: var(--both-bg);  color: var(--both);     border-color: transparent; }
.atag-manual { background: var(--surface2); color: var(--fg-muted); }

/* query toggle */
.query-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 9px 16px;
  background: none;
  border: none;
  border-top: 1px solid var(--border2);
  cursor: pointer;
  color: var(--fg-muted);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  text-align: left;
  transition: background .1s, color .1s;
}
.query-toggle:hover { background: var(--surface2); color: var(--fg); }
.toggle-caret {
  width: 13px; height: 13px; flex-shrink: 0;
  transition: transform .18s;
}
.toggle-caret.open { transform: rotate(90deg); }
.query-toggle-right {
  margin-left: auto;
  display: flex;
  gap: 4px;
  align-items: center;
}
.qlang-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .03em;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--fg-subtle);
}

/* query body */
.query-body { display: none; border-top: 1px solid var(--border2); }
.query-body.open { display: block; }

.qblock { padding: 12px 16px; }
.qblock + .qblock { border-top: 1px solid var(--border2); }

.qblock-hd {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 7px;
}
.qblock-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.dot-cs   { background: var(--cs); }
.dot-spl  { background: var(--spl); }
.qblock-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg-subtle);
  font-weight: 500;
}

pre.qcode {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 13px;
  margin: 0;
  overflow-x: auto;
  line-height: 1.6;
  color: var(--fg);
  tab-size: 2;
}

/* syntax tokens */
.kw  { color: #c678dd; }
.fn  { color: #61afef; }
.str { color: #98c379; }
.op  { color: var(--fg-subtle); }
.cm  { color: var(--fg-subtle); font-style: italic; }
.fd  { color: #e06c75; }
.vl  { color: #d19a66; }
.rx  { color: #56b6c2; }

/* footer */
.page-footer {
  border-top: 1px solid var(--border2);
  padding: 16px 0 32px;
  font-size: 11px;
  color: var(--fg-subtle);
  text-align: center;
}

@media (max-width: 560px) {
  body { padding-inline: 14px; }
  .page-header { margin-inline: -14px; padding: 10px 14px; }
  .card-top { padding: 12px 12px 8px; }
  .card-desc { padding: 0 12px 8px; }
  .caution-note { margin: 0 12px 8px; }
  .actions-row { padding: 0 12px 10px; }
  .query-toggle { padding: 8px 12px; }
  .qblock { padding: 10px 12px; }
}
</style>

<!-- PAGE HEADER -->
<header class="page-header">
  <h1>Detection Coverage Matrix</h1>
  <span class="eng-tag">ENHANCED-MON-2026</span>
  <div class="header-gap"></div>
  <span class="updated-label">Updated Oct 13, 2026</span>
</header>

<!-- SUMMARY TILES -->
<div class="summary-row" id="sumRow"></div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <span class="filter-lbl">Show</span>
  <button class="fbtn active" data-filter="all">All</button>
  <button class="fbtn" data-filter="cs">CrowdStrike</button>
  <button class="fbtn" data-filter="splunk">Splunk</button>
  <button class="fbtn" data-filter="both">Both</button>
</div>

<!-- DETECTION CARDS (rendered by JS) -->
<div class="cards" id="cardList"></div>

<footer class="page-footer" id="footerLine"></footer>

<script>
/* ─── DETECTION DATA ─────────────────────────────────────────── */
const DETECTIONS = [
  {
    id: 1,
    name: "Suspicious DLL Load — Non-Standard Path",
    type: "cs",
    status: "active",
    desc: "Fires when a DLL is loaded by an IIS worker process (or other monitored process) from outside expected system directories. Targets DLL side-loading and search-order hijacking techniques where an attacker plants a DLL in a writable user or temp path.",
    actions: [
      { label: "Memory Snapshot", cls: "atag-auto" },
      { label: "Process Dump", cls: "atag-auto" },
      { label: "Slack Alert", cls: "atag-notify" },
    ],
    caution: null,
    queries: [
      {
        platform: "CS IOA",
        lang: "Custom IOA",
        dotCls: "dot-cs",
        label: "CrowdStrike — Custom IOA Rule",
        code: `<span class="cm">// Custom IOA — Behavioral rule conditions</span>
<span class="fd">Parent Process</span>  : w3wp.exe, inetinfo.exe
<span class="fd">Image Load Path</span>  : NOT STARTSWITH <span class="str">"C:\\Windows\\System32\\"</span>
                 NOT STARTSWITH <span class="str">"C:\\Windows\\SysWOW64\\"</span>
                 NOT STARTSWITH <span class="str">"C:\\Program Files\\"</span>
                 NOT STARTSWITH <span class="str">"C:\\Program Files (x86)\\"</span>
<span class="fd">Extension</span>        : <span class="str">.dll</span>
<span class="fd">Severity</span>         : High`,
      },
      {
        platform: "Splunk",
        lang: "SPL",
        dotCls: "dot-spl",
        label: "Splunk — CS Event Search (validation / hunting)",
        code: `<span class="kw">index</span>=crowdstrike <span class="kw">sourcetype</span>=<span class="str">"crowdstrike:events:sensor"</span>
  <span class="fd">event_simpleName</span>=<span class="vl">ImageLoad</span>
  <span class="fd">ComputerName</span>=<span class="str">"HONEYPOT-SRV01"</span>
<span class="op">|</span> <span class="fn">where</span> NOT <span class="fn">like</span>(<span class="fd">ImageFileName</span>, <span class="str">"C:\\Windows\\System32%"</span>)
    AND NOT <span class="fn">like</span>(<span class="fd">ImageFileName</span>, <span class="str">"C:\\Windows\\SysWOW64%"</span>)
    AND NOT <span class="fn">like</span>(<span class="fd">ImageFileName</span>, <span class="str">"C:\\Program Files%"</span>)
<span class="op">|</span> <span class="fn">eval</span> <span class="fd">suspPath</span>=<span class="fn">case</span>(
    <span class="fn">like</span>(<span class="fd">ImageFileName</span>,<span class="str">"C:\\Users\\%"</span>),       <span class="str">"User Profile"</span>,
    <span class="fn">like</span>(<span class="fd">ImageFileName</span>,<span class="str">"C:\\Temp\\%"</span>),        <span class="str">"Temp Directory"</span>,
    <span class="fn">like</span>(<span class="fd">ImageFileName</span>,<span class="str">"C:\\ProgramData\\%"</span>),  <span class="str">"ProgramData"</span>,
    1==1,                                     <span class="str">"Other"</span>)
<span class="op">|</span> <span class="fn">stats</span> count <span class="kw">by</span> <span class="fd">FileName</span>, <span class="fd">ImageFileName</span>, <span class="fd">UserName</span>, <span class="fd">suspPath</span>
<span class="op">|</span> <span class="fn">sort</span> -count`,
      },
    ],
  },
  {
    id: 2,
    name: "Custom Web Request — Honeypot Trigger URI",
    type: "both",
    status: "active",
    desc: "Detects HTTP requests matching the honeypot application's defined trigger endpoints. The CrowdStrike custom web request IOA fires on the host; Splunk ingests IIS logs independently. A Splunk-only alert on this rule does not initiate automated SOAR response — a corresponding CS detection is required.",
    actions: [
      { label: "Memory Snapshot", cls: "atag-auto" },
      { label: "Process Dump (w3wp)", cls: "atag-auto" },
      { label: "Slack Alert", cls: "atag-notify" },
    ],
    caution: "Splunk alert alone does NOT trigger SOAR response. Requires a corresponding CrowdStrike detection.",
    queries: [
      {
        platform: "CS IOA",
        lang: "Custom IOA",
        dotCls: "dot-cs",
        label: "CrowdStrike — Custom Web Request IOA",
        code: `<span class="cm">// Custom Web Request IOA — trigger conditions</span>
<span class="fd">Sensor</span>          : Falcon Sensor (IIS web request inspection)
<span class="fd">Method</span>          : GET, POST, PUT
<span class="fd">URI Contains</span>    : <span class="str">/api/trigger</span>, <span class="str">/download/payload</span>,
                  <span class="str">/cmd</span>, <span class="str">/shell</span>, <span class="str">/exec</span>
<span class="fd">Response Code</span>   : 2xx  <span class="cm">// Only fire on successful requests</span>
<span class="fd">Action</span>          : Detect + SOAR workflow trigger`,
      },
      {
        platform: "Splunk",
        lang: "SPL",
        dotCls: "dot-spl",
        label: "Splunk — IIS Access Log (independent visibility)",
        code: `<span class="kw">index</span>=iis <span class="kw">sourcetype</span>=<span class="str">"ms:iis:auto"</span> host=<span class="str">"HONEYPOT-SRV01"</span>
<span class="op">|</span> <span class="fn">rex</span> field=<span class="fd">cs_uri_stem</span>
    <span class="str">"(?&lt;trigger_path&gt;/api/trigger|/download/payload|/cmd|/shell|/exec)"</span>
<span class="op">|</span> <span class="fn">where</span> <span class="fn">isnotnull</span>(<span class="fd">trigger_path</span>)
<span class="op">|</span> <span class="fn">eval</span>
    src_ip=<span class="fd">c_ip</span>,
    method=<span class="fd">cs_method</span>,
    uri=<span class="fd">cs_uri_stem</span>,
    status=<span class="fd">sc_status</span>,
    ua=<span class="fd">cs_user_agent</span>
<span class="op">|</span> <span class="fn">table</span> _time, src_ip, method, uri, status, ua
<span class="op">|</span> <span class="fn">sort</span> -_time`,
      },
    ],
  },
  {
    id: 3,
    name: "Network IOC Match — C2 / Threat Intel Feed",
    type: "cs",
    status: "active",
    desc: "Matches outbound DNS queries and network connections against the active CrowdStrike threat intelligence IOC list. Covers known C2 infrastructure, malicious domains, and IP ranges associated with threat actors of interest to this engagement.",
    actions: [
      { label: "Slack Alert", cls: "atag-notify" },
      { label: "Analyst Review", cls: "atag-manual" },
    ],
    caution: null,
    queries: [
      {
        platform: "CS Events",
        lang: "SPL (CS index)",
        dotCls: "dot-cs",
        label: "Splunk — CS Network Events (hunting / triage)",
        code: `<span class="kw">index</span>=crowdstrike <span class="kw">sourcetype</span>=<span class="str">"crowdstrike:events:sensor"</span>
  <span class="fd">ComputerName</span>=<span class="str">"HONEYPOT-SRV01"</span>
  (<span class="fd">event_simpleName</span>=<span class="vl">DnsRequest</span> OR <span class="fd">event_simpleName</span>=<span class="vl">NetworkConnectIP4</span>)

    indicator=<span class="fn">coalesce</span>(<span class="fd">DomainName</span>, <span class="fd">RemoteAddressIP4</span>),
    event_type=<span class="fd">event_simpleName</span>
<span class="op">|</span> <span class="fn">lookup</span> ioc_feed indicator <span class="kw">OUTPUT</span> threat_actor, malware_family, confidence
<span class="op">|</span> <span class="fn">where</span> <span class="fn">isnotnull</span>(<span class="fd">threat_actor</span>)
<span class="op">|</span> <span class="fn">table</span> _time, event_type, indicator, threat_actor, malware_family, confidence
<span class="op">|</span> <span class="fn">sort</span> -confidence, -_time`,
      },
    ],
  },
  {
    id: 4,
    name: "IIS Worker Process — Abnormal Child Process Spawn",
    type: "both",
    status: "active",
    desc: "IIS worker process (w3wp.exe) spawning shells or script interpreters is a high-confidence indicator of webshell execution or server-side code injection. Correlates CrowdStrike process telemetry with Sysmon process creation events for full command-line visibility.",
    actions: [
      { label: "Memory Snapshot", cls: "atag-auto" },
      { label: "Process Dump (w3wp)", cls: "atag-auto" },

/* ─── RENDER ─────────────────────────────────────────────────── */
const LABEL = {
  cs:     { badge: "badge-cs",   text: "CrowdStrike" },
  splunk: { badge: "badge-spl",  text: "Splunk" },
  both:   { badge: "badge-both", text: "CS + Splunk" },
};

function renderCards(filter) {
  const list = document.getElementById("cardList");
  list.innerHTML = "";

  DETECTIONS.forEach(d => {
    const show = filter === "all" || d.type === filter;
    const card = document.createElement("div");
    card.className = `card${show ? "" : " hidden"}`;
    card.dataset.type = d.type;
    card.dataset.id   = d.id;

    const lbl = LABEL[d.type];
    const statusBadge = d.status === "active"
      ? `<span class="badge badge-active">● Active</span>`
      : `<span class="badge badge-test">⬤ Testing</span>`;

    const actions = d.actions.map(a =>
      `<span class="atag ${a.cls}">${a.label}</span>`
    ).join("");

    const caution = d.caution
      ? `<div class="caution-note">${d.caution}</div>`
      : "";

    const hasQueries = d.queries && d.queries.length > 0;
    const langs = [...new Set(d.queries.map(q => q.lang))].map(l =>
      `<span class="qlang-pill">${l}</span>`
    ).join("");

    const queryBlocks = d.queries.map(q => `
      <div class="qblock">
        <div class="qblock-hd">
          <span class="qblock-dot ${q.dotCls}"></span>
          <span class="qblock-title">${q.label}</span>
        </div>
        <pre class="qcode">${q.code}</pre>
      </div>
    `).join("");

    const querySection = hasQueries ? `
      <button class="query-toggle" onclick="toggleQuery(this)">
        <svg class="toggle-caret" viewBox="0 0 12 12" fill="none">
          <path d="M4 2L8 6L4 10" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Query Syntax
        <div class="query-toggle-right">${langs}</div>
      </button>
      <div class="query-body">${queryBlocks}</div>
    ` : "";

    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${d.name}</div>
        <div class="badges">
          <span class="badge ${lbl.badge}">${lbl.text}</span>
          ${statusBadge}
        </div>
      </div>
      <div class="card-desc">${d.desc}</div>
      ${caution}
      <div class="actions-row">
        <span class="actions-lbl">Response</span>
        ${actions}
      </div>
      ${querySection}
    `;

    list.appendChild(card);
  });
}

function toggleQuery(btn) {
  const caret = btn.querySelector(".toggle-caret");
  const body  = btn.nextElementSibling;
  const open  = body.classList.toggle("open");
  caret.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", open);
}

/* ─── FILTERS ────────────────────────────────────────────────── */
document.querySelectorAll(".fbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const filter = btn.dataset.filter;
    document.querySelectorAll(".card").forEach(c => {
      const show = filter === "all" || c.dataset.type === filter;
      c.classList.toggle("hidden", !show);
    });
  });
});

/* ─── SUMMARY TILES ──────────────────────────────────────────── */
function buildSummary() {
  const totals = { total: DETECTIONS.length, cs: 0, splunk: 0, both: 0, active: 0 };
  DETECTIONS.forEach(d => {
    totals[d.type]++;
    if (d.status === "active") totals.active++;
  });

  const tiles = [
    { cls: "tile-total",  num: totals.total,  lbl: "Detections" },
    { cls: "tile-cs",     num: totals.cs,      lbl: "CrowdStrike" },
    { cls: "tile-spl",    num: totals.splunk,  lbl: "Splunk Only" },
    { cls: "tile-both",   num: totals.both,    lbl: "CS + Splunk" },
    { cls: "tile-active", num: totals.active,  lbl: "Active" },
  ];

  const row = document.getElementById("sumRow");
  row.innerHTML = tiles.map(t => `
    <div class="tile ${t.cls}">
      <div class="tile-num">${t.num}</div>
      <div class="tile-lbl">${t.lbl}</div>
    </div>
  `).join("");

  document.getElementById("footerLine").textContent =
    `Enhanced Monitoring Engagement  ·  ${totals.total} detections  ·  ${totals.active} active  ·  Oct 2026`;
}

/* ─── INIT ───────────────────────────────────────────────────── */
buildSummary();
renderCards("all");
